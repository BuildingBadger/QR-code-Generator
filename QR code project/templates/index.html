<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #3f3a38; /* Warm Dark Grey */
            color: #f8fafc; /* Off-White Text */
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 5px;
            color: #f8fafc;
        }

        h2 {
            font-size: 1.1rem;
            color: #d6cfc9; /* Warm Lighter Grey Subtext */
            font-weight: 400;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 1rem;
            background-color: #2e2a28; /* Deeper Warm Grey Input Box */
            color: #f8fafc; /* White Input Text */
            border: 1px solid #5c5450; /* Subtle Warm Border */
            border-radius: 5px;
            width: 250px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #a39b98; /* Warm gray placeholder text */
        }

        input[type="text"]:focus {
            border-color: #FF8700; /* McLaren Papaya Spark Border */
            box-shadow: 0 0 5px rgba(255, 135, 0, 0.5); /* Subtle Papaya Glow */
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            /* McLaren Papaya Spark Gradient */
            background: linear-gradient(135deg, #FF8700 0%, #e65c00 100%); 
            color: #111111; /* Dark text for high contrast */
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            opacity: 0.9; /* Slight fade on hover */
            transform: scale(1.05)
        }
        
        button:active {
            transform: translateY(2px); /* Push down when clicked */
        }

        .qr-code img {
            max-width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            background-color: white; 
            padding: 10px; 
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>QR Code Generator</h1>
        <h2>Insert a link to generate a QR code</h2>
    </div>
    
    <form action="/" method="POST">
        <input type="text" name="link" placeholder="Enter a link" required>
        <button type="submit">Generate QR Code</button>
    </form>
    
    <!-- This block will only render if the backend sends 'data' -->
    {% if data %}
    <div class="qr-code">
        <img src="{{ data }}" alt="Generated QR Code">
    </div>
    {% endif %}
</body>
</html>
